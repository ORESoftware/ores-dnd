schema = "ores.dnd.fleet-rollout/v1"
dependency = "oresoftware/ores-dnd"
version = "^0.1.0"
linear = "DEN-1025"

# First cohort: 20 non-test organizations with a shared public core plus web,
# Rust desktop, and Flutter families discovered from the connected GitHub fleet.
[[targets]]
org = "gha-indie-worker"
pub_lib_core = "gha-indie-worker-pub-lib-core"
web = "gha-indie-worker-web-server.rs"
desktop = "gha-indie-worker-desktop-app.rs"
flutter = "gha-indie-worker-flutter"

