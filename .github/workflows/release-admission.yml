name: release-admission

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-dnd-release-admission-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  # Pinned to the reviewed Zed commit that introduced first-class paired
  # contracts/conformance lifecycle admission (zed-pkg/zed-cli#468).
  ZED_CLI_REV: 1a613b8345b0aecf24eb925720c0784782ac5dd8
  CARGO_TARGET_DIR: ${{ github.workspace }}/.deps/zed-target

jobs:
  release-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact ores-dnd candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact contributor head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node.js for manifest parsing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Set up Rust for pinned Zed CLI
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Check out pinned Zed CLI
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: zed-pkg/zed-cli
          ref: ${{ env.ZED_CLI_REV }}
          path: .deps/zed-cli
          persist-credentials: false
      - name: Build pinned Zed CLI
        run: cargo build --locked --manifest-path .deps/zed-cli/Cargo.toml --bin zed
      - name: Check cross-runtime release metadata
        run: bash scripts/check-release-admission.sh
      - name: Validate canonical Zed package manifest
        run: .deps/zed-target/debug/zed validate --manifest .zpkg.toml --json
      - name: Roundtrip package through credential-free local registry
        run: .deps/zed-target/debug/zed r2g
      - name: Verify release admission did not mutate tracked source
        run: git diff --exit-code -- . ':(exclude).deps/**'
