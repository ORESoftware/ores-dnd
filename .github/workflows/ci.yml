name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ores-dnd-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact contributor head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Install contract toolchain without ambient lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build reviewed flags2env native binding only
        run: npm --prefix node_modules/@oresoftware/f2e run install
      - run: mkdir -p artifacts
      - name: Check independent TypeSpec and JSON Schema authorities
        run: npm run contracts:check
      - name: Verify contract tooling did not mutate tracked source
        run: git diff --exit-code

  typescript:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact contributor head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - run: npm install --prefix src/ts --ignore-scripts --no-audit --no-fund
      - run: npm --prefix src/ts test
      - name: Verify TypeScript tooling did not mutate tracked source
        run: git diff --exit-code

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact contributor head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt,clippy
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - run: cargo test -p ores-dnd-core --all-features
      - name: Clippy all ores-dnd-core targets
        run: cargo clippy -p ores-dnd-core --all-targets --all-features -- -D warnings
      - name: Verify Rust tooling did not mutate tracked source
        run: git diff --exit-code

  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact contributor head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Rust/WASM
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - run: cargo check -p ores-dnd-wasm --target wasm32-unknown-unknown
      - name: Verify WASM tooling did not mutate tracked source
        run: git diff --exit-code

  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/dart
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact contributor head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Dart
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable
      - run: dart pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: dart analyze --fatal-infos
      - run: dart test
      - name: Verify Dart tooling did not mutate tracked source
        run: git diff --exit-code

  flutter:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src/flutter
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.EXPECTED_SHA }}
          persist-credentials: false
      - name: Verify exact contributor head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - run: flutter pub get
      - name: Check Flutter/Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Verify Flutter tooling did not mutate tracked source
        run: git diff --exit-code
