name: format-diagnostic

on:
  push:
    branches:
      - DEN-1025-flutter-keyboard-driver

permissions:
  contents: read

jobs:
  flutter-format-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact diagnostic head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact diagnostic head
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Print canonical formatter diff
        working-directory: src/flutter
        run: |
          dart format lib test
          git diff -- test/ores_dnd_keyboard_test.dart
          exit 1
