[package]
name = "ores-dnd-example-mash-kanban"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Reference MASH (maud + axum + htmx) kanban board using ores-dnd end to end"

[[bin]]
name = "mash-kanban"
path = "src/main.rs"

[dependencies]
ores-dnd-core = { path = "../../src/rust", default-features = false }
ores-dnd-mash = { path = "../../src/rust-mash" }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
maud = { version = "0.27", features = ["axum"] }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
