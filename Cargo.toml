[workspace]
members = ["src/rust", "src/rust-wasm"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/ORESoftware/ores-dnd"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
# RxRust's default scheduler feature exposes the Local/Shared contexts and has
# target-specific WASM support. ores-dnd still leaves context/threading choice
# to each host application rather than hard-coding one scheduler policy.
rxrust = "=1.0.0-rc.5"
