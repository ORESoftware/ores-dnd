[package]
org = "oresoftware"
name = "ores-dnd"
version = "0.1.0"
description = "Cross-runtime drag-and-drop contracts and adapters"
license = "MIT"
keywords = ["drag-drop", "wasm", "typescript", "rust", "flutter", "dart"]

[package.repository]
vcs = "git"
url = "https://github.com/ORESoftware/ores-dnd"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = [".env", ".env.*", ".direnv/**", ".vendor/.zed/**", ".zed/**", ".zed-pack/**", "tmp/**", "**/*.log", ".DS_Store", "**/target/**", "**/node_modules/**", "**/dist/**", "**/.dart_tool/**", "**/build/**", "artifacts/**", ".typespec-json-schema-validator/**"]

[install]
dir = ".vendor/.zed"

[targets.repository]
dir = "."

[targets.rust]
dir = "src/rust"
adapter = "rust"

[targets.wasm]
dir = "src/rust-wasm"
adapter = "rust"

# Framework adapters: each depends on ores-dnd-core, never the reverse, so a
# Leptos/Dioxus/axum release is an adapter change and not a protocol change.
[targets.mash]
dir = "src/rust-mash"
name = "ores-dnd-mash"
adapter = "rust"

[targets.leptos]
dir = "src/rust-leptos"
name = "ores-dnd-leptos"
adapter = "rust"

[targets.dioxus]
dir = "src/rust-dioxus"
name = "ores-dnd-dioxus"
adapter = "rust"

[targets.typescript]
dir = "src/ts"
name = "ores-dnd-typescript"
adapter = "node"

# Pure Dart protocol/runtime target. This intentionally has no Flutter dependency
# so public core packages can consume the contract without importing UI code.
[targets.dart]
dir = "src/dart"
adapter = "dart"

# Flutter widgets are a separate target so hosts opt into framework dependencies.
[targets.flutter]
dir = "src/flutter"
adapter = "dart"

[targets.contracts]
dir = "contracts"
name = "ores-dnd-contracts"
adapter = "none"
