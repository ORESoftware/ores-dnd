[package]
org = "oresoftware"
name = "ores-dnd"
version = "0.1.0"
description = "Cross-runtime drag-and-drop contracts and adapters"
license = "MIT"
keywords = ["drag-drop", "wasm", "typescript", "rust", "native", "flutter", "dart"]

[package.repository]
vcs = "git"
url = "https://github.com/ORESoftware/ores-dnd"

[publish]
include_readme = true
tag_format = "v{version}"
exclude = ["examples/**", ".env", ".env.*", ".direnv/**", ".vendor/.zed/**", ".zed/**", ".zed-pack/**", "tmp/**", "**/*.log", ".DS_Store", "**/target/**", "**/node_modules/**", "**/dist/**", "**/.dart_tool/**", "**/build/**", "artifacts/**", ".typespec-json-schema-validator/**"]

[install]
dir = ".vendor/.zed"

[targets.repository]
dir = "."

[targets.rust]
dir = "src/rust"
adapter = "rust"

[targets.wasm]
dir = "src/rust-wasm"
adapter = "rust"

[targets.native]
dir = "src/rust-native"
name = "ores-dnd-native"
adapter = "rust"

[targets.mash]
dir = "src/rust-mash"
name = "ores-dnd-mash"
adapter = "rust"

[targets.leptos]
dir = "src/rust-leptos"
name = "ores-dnd-leptos"
adapter = "rust"

[targets.dioxus]
dir = "src/rust-dioxus"
name = "ores-dnd-dioxus"
adapter = "rust"

[targets.typescript]
dir = "src/ts"
name = "ores-dnd-typescript"
adapter = "node"

[targets.dart]
dir = "src/dart"
adapter = "dart"

[targets.flutter]
dir = "src/flutter"
adapter = "dart"

[targets.contracts]
dir = "contracts"
name = "ores-dnd-contracts"
adapter = "none"

[targets.conformance]
dir = "conformance"
name = "ores-dnd-conformance"
adapter = "none"

[scripts]
# Current Zed itself executes the canonical conformance checker around package
# lifecycle operations. Keep the package test credential-free/offline so r2g's
# local registry remains a real release gate.
test = "node conformance/check.mjs"
